[project]
name = "training-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "coqui-tts[codec,languages]>=0.27.5",
    "torch>=2.14.0",
    "torchaudio>=2.11.0",
    "transformers==5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[project.scripts]
training-pipeline = "pipeline.cli:main"
