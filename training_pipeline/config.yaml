model:
  type: tacotron2
  sample_rate: 22050

training:
  epochs: 1
  batch_size: 2
  eval_batch_size: 2
  learning_rate: 0.001
  output_path: "./output"
  eval_split_size: 0.01
  eval_split_max_size: 100

dataset:
  path: "./tmp/LJSpeech-1.1"
  max_samples: 5
  formatter: "ljspeech"
  meta_file_train: "metadata.csv"