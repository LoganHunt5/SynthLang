# Proof of concept: fine-tune the pretrained English Tacotron2 (ek1) on a
# 1 hour Spanish subset of SSS_Output to simulate a low-resource language.
#
#
# Expected layout (paths are relative to the training_pipeline directory):
#   tmp/SSS_Output/*.wav                          Spanish audio (22050 Hz mono)
#   tmp/SSS_small_60min.txt                       subset from scripts/make_small_subset.py
#   tmp/ek1_tacotron2_weights.pth                 English base model (ek1), from
#                                                 scripts/convert_checkpoint.py
#
# Listen to results with scripts/synthesize.py, not only TensorBoard: the
# TensorBoard test audio uses Coqui's inference, which can stop too early.

backend: coqui

training:
  # Sized for a 24 GB Titan RTX. ek1's own last phase also used r=2 with a
  # batch of 32 at lr 1e-4. Must match the batch size in
  # model.params.gradual_training, which overrides it.
  batch_size: 32
  eval_batch_size: 32
  # A ceiling, not a target: ~36 steps/epoch, so ~36k steps. Stop early
  # (Ctrl+C saves a checkpoint) once the samples stop improving, or pick the
  # best checkpoint by listening. One hour of audio overfits long before the
  # paper's 72 h on faster hardware.
  epochs: 1000
  # ek1 was trained at 1e-4; fine-tuning should not use a larger rate.
  learning_rate: 0.0001
  output_path: tmp/sss_finetune
  eval_split_size: 0.1
  # More eval clips make best_model selection (eval postnet_loss, which rises
  # once the model overfits) more reliable.
  eval_split_max_size: 60
  # Start from the English base model. Not from the first 1 hour run
  # (tmp/sss-finetune-snapshot): its subset included the silent MixPre-002_ch1
  # session, and at inference it fades into silence after the first sounds.
  warm_start:
    enabled: true
    checkpoint_path: tmp/ek1_tacotron2_weights.pth

dataset:
  # css10 reads "relative/audio.wav|text" lines relative to this folder.
  path: tmp
  formatter: css10
  meta_file_train: SSS_small_60min.txt

model:
  type: tacotron2
  sample_rate: 22050
  params:
    # --- Text: Spanish phonemes mapped onto ek1's IPA symbol set ---
    phoneme_language: es
    phonemizer: gruut
    # The default cleaners expand numbers and abbreviations in English.
    text_cleaner: multilingual_phoneme_cleaners
    # ek1's exact symbol set. Order and size must match the checkpoint's text
    # embedding, otherwise every symbol loads the wrong weights.
    characters:
      characters_class: TTS.tts.utils.text.characters.IPAPhonemes
      pad: _
      eos: "~"
      bos: ^
      blank: null
      characters: "abcdefhijklmnopqrstuvwxyzæçðøħŋœǀǁǂǃɐɑɒɓɔɕɖɗɘəɚɛɜɞɟɠɡɢɣɤɥɦɧɨɪɫɬɭɮɯɰɱɲɳɴɵɶɸɹɺɻɽɾʀʁʂʃʄʈʉʊʋʌʍʎʏʐʑʒʔʕʘʙʛʜʝʟʡʢˈˌːˑ˞βθχᵻⱱ"
      punctuations: "!'(),-.:;? "
      phonemes: null
      is_unique: true
      is_sorted: true

    # --- Architecture: must match ek1 so every layer loads from the checkpoint ---
    # r = frames predicted per decoder step. ek1's layers are sized for r=7
    # but it was last trained at r=2; at r=7 it never predicts "stop".
    # The schedule ([start_step, r, batch_size]) trains at r=2 from step 0:
    #   - its first entry must equal `r` (Coqui checks this), so layers are
    #     sized for 7 and every weight loads;
    #   - its last entry also starts at step 0, so r=2 is set before the data
    #     loader is built. r must never change after that: Coqui builds the
    #     loader once, and a later change of r crashes training.
    # Keep the batch size here equal to training.batch_size; it overrides it.
    r: 7
    gradual_training: [[0, 7, 32], [0, 2, 32]]
    attention_type: original
    location_attn: true
    use_forward_attn: true
    forward_attn_mask: false
    attention_norm: sigmoid
    windowing: false
    transition_agent: false
    prenet_type: original
    prenet_dropout: false
    stopnet: true
    separate_stopnet: true
    double_decoder_consistency: false
    bidirectional_decoder: false
    memory_size: -1

    # --- Audio: ek1's spectrogram settings, so its decoder output still fits ---
    audio:
      fft_size: 1024
      win_length: 1024
      hop_length: 256
      num_mels: 80
      preemphasis: 0.99
      ref_level_db: 0
      power: 1.8
      mel_fmin: 0.0
      mel_fmax: 8000.0
      spec_gain: 1.0
      signal_norm: true
      min_level_db: -10
      symmetric_norm: true
      max_norm: 4.0
      clip_norm: true

    # --- Fine-tuning schedule ---
    # Constant learning rate like ek1, instead of Coqui's Noam warmup, which
    # would spend this whole short run ramping up.
    lr_scheduler: null
    # ek1's loss/optimizer settings (Coqui defaults: 0.2 and 5.0). In 6-epoch
    # tests 15.0 and 0.2 behaved the same: both models stopped too early at
    # inference (see scripts/synthesize.py for the workaround).
    stopnet_pos_weight: 15.0
    grad_clip: 1.0
    # Guided attention loss (ek1 was trained with 5.0): penalizes attention
    # that strays from the diagonal, so it keeps moving through the text.
    # Without it, attention got stuck on one sound late in each sentence.
    ga_alpha: 5.0
    # New name for each experiment so its run folder is easy to tell apart.
    run_name: sss_spanish_finetune_ga5_nosilence
    # Pick best_model by spectrogram quality. The default (total eval loss)
    # includes the noisy stop-token loss on a tiny eval set and kept
    # selecting the first epoch.
    target_loss: postnet_loss
    # ~every 55 epochs (~36 steps/epoch); keep 10 (~3.5 GB, ~350 MB each)
    # so earlier checkpoints survive for comparison if later ones overfit.
    save_step: 2000
    save_n_checkpoints: 10
    # Synthesized each epoch (Griffin-Lim) so progress can be heard in TensorBoard.
    test_sentences:
      - "Hola, este es un modelo entrenado con muy pocos datos."
      - "La prevalencia mundial estimada es muy alta en niños."
      - "Wikipedia es una enciclopedia libre y colaborativa."
